# .github/workflows/deployment.yml
name: Deploy Image

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
      container_name:
        required: true
        type: string
    secrets:
      SSH_PASSWORD:
        required: true
      EC2_HOST:
        required: true
      EC2_USERNAME:
        required: true
      EC2_PORT:
        required: true
      DATABASE_URL:
        required: true
      DOCKER_REPO:
        required: true
      HOST_UPLOAD_PATH:
        required: true
      JWT_SECRET:
        required: true
      R2_ACCOUNT_ID:
        required: false
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
      R2_BUCKET_NAME:
        required: false
      R2_PUBLIC_DOMAIN:
        required: false

jobs:
    deploy:
      runs-on: ubuntu-latest
      environment: sites
      steps:
        - name: Deployment
          uses: appleboy/ssh-action@v1.0.3
          with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USERNAME }}
            port: ${{ secrets.EC2_PORT }}
            password: ${{ secrets.SSH_PASSWORD }}
            script: |
              CONTAINER_NAME="${{ inputs.container_name }}"
              IMAGE_TAG="${{ secrets.DOCKER_REPO }}:${{ inputs.image_tag }}"
              
              docker stop "${CONTAINER_NAME}" || true
              docker rm "${CONTAINER_NAME}" || true
              docker pull "$IMAGE_TAG"

              docker run -d \
                -v ${{ secrets.HOST_UPLOAD_PATH }}:/app/uploads \
                --network tunnel \
                --user 1000:1000 \
                --name "${CONTAINER_NAME}" \
                -e NODE_ENV="production" \
                -e PORT="${{ vars.PORT }}" \
                -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
                -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
                -e JWT_EXPIRATION="24h" \
                -e R2_ACCOUNT_ID="${{ secrets.R2_ACCOUNT_ID }}" \
                -e R2_ACCESS_KEY_ID="${{ secrets.R2_ACCESS_KEY_ID }}" \
                -e R2_SECRET_ACCESS_KEY="${{ secrets.R2_SECRET_ACCESS_KEY }}" \
                -e R2_BUCKET_NAME="${{ secrets.R2_BUCKET_NAME }}" \
                -e R2_PUBLIC_DOMAIN="${{ secrets.R2_PUBLIC_DOMAIN }}" \
                --restart unless-stopped \
                "$IMAGE_TAG"
              echo "Deployment completed successfully."
              
              docker image prune -f
              echo "Old images pruned."